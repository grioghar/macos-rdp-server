name: CI Build Check

# Fast compile validation on every push/PR to master. arm64-only, no release.
# Reuses the cached fork-built FreeRDP from the release workflow.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # release job (push to master) needs this to create releases

jobs:
  build-check:
    name: Compile check (arm64)
    runs-on: macos-14
    outputs:
      sha: ${{ steps.ver.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config openssl@3
          echo "OPENSSL_ROOT=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Read FreeRDP version
        id: freerdp-ver
        run: echo "ver=$(tr -d '[:space:]' < .github/freerdp-version)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeRDP static build
        id: cache-freerdp
        uses: actions/cache@v4
        with:
          path: ~/freerdp-install
          key: freerdp-${{ steps.freerdp-ver.outputs.ver }}-arm64-static-v7-rdpdr

      - name: Build FreeRDP (static, fork branch)
        if: steps.cache-freerdp.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/freerdp-src"
          INSTALL="$HOME/freerdp-install"
          git clone --depth 1 --branch "build/3.10.3-patched" \
            https://github.com/grioghar/FreeRDP.git "$SRC"
          cmake -S "$SRC" -B "$SRC/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS="-Os" -DCMAKE_CXX_FLAGS="-Os" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DCMAKE_PREFIX_PATH="$OPENSSL_ROOT" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_SERVER=ON -DWITH_PLATFORM_SERVER=OFF \
            -DWITH_CLIENT=OFF -DWITH_CLIENT_COMMON=OFF -DWITH_PROXY=OFF \
            -DWITH_SHADOW=OFF -DWITH_SAMPLE=OFF -DWITH_WINPR_TOOLS=OFF \
            -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_DSP_FFMPEG=OFF \
            -DWITH_CAIRO=OFF -DWITH_OPUS=OFF -DWITH_RDTK=OFF \
            -DWITH_WAYLAND=OFF -DWITH_X11=OFF -DWITH_CUPS=OFF -DWITH_PCSC=OFF \
            -DWITH_JPEG=OFF -DWITH_WEBP=OFF -DWITH_OSS=OFF -DWITH_ALSA=OFF -DWITH_PULSE=OFF \
            -DWITH_CHANNELS=ON -DWITH_RDPSND=ON -DWITH_CLIPRDR=ON -DWITH_RDPGFX=ON \
            -DWITH_RDPEI=OFF -DWITH_RDPDR=ON -DWITH_SERVER_CHANNELS=ON -DWITH_PRINTER=OFF -DWITH_SMARTCARD=OFF \
            -DWITH_SERIAL=OFF -DWITH_PARALLEL=OFF -DWITH_URBDRC=OFF \
            -DWITH_VIDEO_ENCODER=OFF -DWITH_NEON=OFF -DBUILD_TESTING=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$SRC/build" --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$SRC/build"

      - name: Compute build version (short SHA)
        id: ver
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compile macos-rdp-daemon
        run: |
          set -euo pipefail
          # Stamp the binary with the short SHA so it equals the release tag the
          # release job publishes below; a freshly-deployed build then reports
          # "up to date" against its own release.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DMACOS_RDP_STATIC=ON \
            -DMACOS_RDP_BUILD_VERSION="${{ steps.ver.outputs.sha }}" \
            -DFREERDP_STATIC_INSTALL="$HOME/freerdp-install" \
            -DCMAKE_PREFIX_PATH="$HOME/freerdp-install;$OPENSSL_ROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"
          file build/macos-rdp-daemon
          strip -x build/macos-rdp-daemon

      - name: Upload arm64 binary (for fast test deploys)
        uses: actions/upload-artifact@v4
        with:
          name: macos-rdp-daemon-arm64
          path: build/macos-rdp-daemon
          retention-days: 3
          if-no-files-found: error

  # Separate, additive job: compile the Swift/AppKit menu-bar config app.
  # Independent of the daemon build above so it can never break it.
  build-gui:
    name: Compile GUI config app (Swift)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Compile menu-bar app
        run: ./gui/build.sh --compile-only

  # ── Auto-update feed ──────────────────────────────────────────────────────
  # On push to master only (NOT PRs), publish/refresh a GitHub Release tagged
  # with the short SHA, carrying the freshly-built arm64 `macos-rdp-daemon`
  # binary + a `macos-rdp-daemon.sha256` asset. The daemon's auto-updater polls
  # releases/latest, compares tag_name to its stamped MACOS_RDP_BUILD_VERSION
  # (== this SHA), and pulls when they differ. Idempotent: an existing tag is
  # deleted and recreated so re-runs don't fail.
  release-build:
    name: Publish auto-update release
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-rdp-daemon-arm64
          path: dist

      - name: Prepare assets (sha256)
        run: |
          set -euo pipefail
          chmod 755 dist/macos-rdp-daemon
          # Bare 64-hex digest the daemon's regex/sha parser expects.
          shasum -a 256 dist/macos-rdp-daemon | awk '{print $1}' > dist/macos-rdp-daemon.sha256
          echo "sha256: $(cat dist/macos-rdp-daemon.sha256)"

      - name: Publish release (tag = short SHA, marked latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-check.outputs.sha }}
        run: |
          set -euo pipefail
          # Idempotent: drop any pre-existing release+tag for this SHA, then recreate.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — deleting to recreate"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --title "macos-rdp-daemon build $TAG" \
            --notes "Automated auto-update build for commit ${GITHUB_SHA}. sha256: $(cat dist/macos-rdp-daemon.sha256)" \
            --latest \
            --target "$GITHUB_SHA" \
            dist/macos-rdp-daemon \
            dist/macos-rdp-daemon.sha256
