name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  build-and-release:
    name: Build universal binary and release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config openssl@3
          echo "OPENSSL_ROOT=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Read FreeRDP version
        id: freerdp-ver
        run: echo "ver=$(tr -d '[:space:]' < .github/freerdp-version)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeRDP universal static build
        id: cache-freerdp
        uses: actions/cache@v4
        with:
          path: ~/freerdp-install
          key: freerdp-${{ steps.freerdp-ver.outputs.ver }}-universal-static-v1

      - name: Build FreeRDP (universal static)
        if: steps.cache-freerdp.outputs.cache-hit != 'true'
        env:
          FREERDP_VER: ${{ steps.freerdp-ver.outputs.ver }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/freerdp-src"
          INSTALL="$HOME/freerdp-install"

          git clone --depth 1 --branch "$FREERDP_VER" \
              https://github.com/FreeRDP/FreeRDP.git "$SRC"

          cmake -S "$SRC" -B "$SRC/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DCMAKE_C_FLAGS="-Os" \
              -DCMAKE_CXX_FLAGS="-Os" \
              -DCMAKE_INSTALL_PREFIX="$INSTALL" \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
              -DCMAKE_PREFIX_PATH="$OPENSSL_ROOT" \
              -DBUILD_SHARED_LIBS=OFF \
              -DWITH_SERVER=ON \
              -DWITH_CLIENT=OFF \
              -DWITH_CLIENT_COMMON=OFF \
              -DWITH_PROXY=OFF \
              -DWITH_SHADOW=OFF \
              -DWITH_SAMPLE=OFF \
              -DWITH_WINPR_TOOLS=OFF \
              -DWITH_FFMPEG=OFF \
              -DWITH_SWSCALE=OFF \
              -DWITH_DSP_FFMPEG=OFF \
              -DWITH_CAIRO=OFF \
              -DWITH_OPUS=OFF \
              -DWITH_RDTK=OFF \
              -DWITH_WAYLAND=OFF \
              -DWITH_X11=OFF \
              -DWITH_CUPS=OFF \
              -DWITH_PCSC=OFF \
              -DWITH_JPEG=OFF \
              -DWITH_WEBP=OFF \
              -DWITH_OSS=OFF \
              -DWITH_ALSA=OFF \
              -DWITH_PULSE=OFF \
              -DWITH_CHANNELS=ON \
              -DWITH_RDPSND=ON \
              -DWITH_CLIPRDR=ON \
              -DWITH_RDPGFX=ON \
              -DWITH_RDPEI=OFF \
              -DWITH_RDPDR=OFF \
              -DWITH_PRINTER=OFF \
              -DWITH_SMARTCARD=OFF \
              -DWITH_SERIAL=OFF \
              -DWITH_PARALLEL=OFF \
              -DWITH_URBDRC=OFF \
              -DWITH_VIDEO_ENCODER=OFF \
              -DWITH_NEON=OFF \
              -DBUILD_TESTING=OFF \
              -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
              -DOPENSSL_USE_STATIC_LIBS=TRUE

          cmake --build "$SRC/build" --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$SRC/build"

      - name: Build macos-rdp-daemon (universal)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
              -DMACOS_RDP_STATIC=ON \
              -DFREERDP_STATIC_INSTALL="$HOME/freerdp-install" \
              -DCMAKE_PREFIX_PATH="$HOME/freerdp-install;$OPENSSL_ROOT" \
              -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
              -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Verify universal binary
        run: |
          BIN=build/macos-rdp-daemon
          echo "=== architectures ==="
          lipo -info "$BIN"
          echo "=== external dylib deps ==="
          otool -L "$BIN"
          EXTERNAL=$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' \
            | grep -v '^/usr/lib/' | grep -v '^/System/' | grep -v '^@' || true)
          if [[ -n "$EXTERNAL" ]]; then
            echo "ERROR: non-system dylib dependencies found:"
            echo "$EXTERNAL"; exit 1
          fi
          echo "OK — universal binary, system deps only"
          strip -x "$BIN"
          ls -lh "$BIN"

      - name: Compute SHA-256
        run: |
          shasum -a 256 build/macos-rdp-daemon > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          FREERDP_VER=$(tr -d '[:space:]' < .github/freerdp-version)

          gh release create "$TAG" \
            --title "macos-rdp-server $TAG" \
            --notes "$(cat <<EOF
## macos-rdp-server $TAG

Lightweight RDP server for macOS. Single universal binary — runs natively on both Intel and Apple Silicon. No Homebrew, no compilation.

### One-line install

\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/grioghar/macos-rdp-server/main/scripts/remote-install.sh | sudo bash
\`\`\`

### Manual download

\`\`\`bash
sudo curl -fsSL https://github.com/grioghar/macos-rdp-server/releases/download/$TAG/macos-rdp-daemon -o /usr/local/sbin/macos-rdp-daemon
sudo chmod +x /usr/local/sbin/macos-rdp-daemon
\`\`\`

### Verify checksum

\`\`\`bash
curl -fsSL https://github.com/grioghar/macos-rdp-server/releases/download/$TAG/SHA256SUMS | shasum -c
\`\`\`

### What's included

- H.264 hardware encoding via VideoToolbox
- Screen capture via CGDisplayStream (zero-copy IOSurface path)
- System audio redirection via CoreAudio HAL
- Bidirectional clipboard (text + images)
- Full keyboard/mouse injection
- TLS encryption (self-signed cert on first run)
- Zero idle CPU: frame encode skipped on static screens, event-driven signal handling

### Built with

- FreeRDP $FREERDP_VER (statically linked — no runtime dependencies)
- macOS 14 SDK · Universal binary (arm64 + x86_64)
EOF
)" \
            build/macos-rdp-daemon \
            build/SHA256SUMS
