name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config openssl@3
          echo "OPENSSL_ROOT=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Read FreeRDP version
        id: freerdp-ver
        run: echo "ver=$(tr -d '[:space:]' < .github/freerdp-version)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeRDP static build
        id: cache-freerdp
        uses: actions/cache@v4
        with:
          path: ~/freerdp-install
          key: freerdp-${{ steps.freerdp-ver.outputs.ver }}-${{ matrix.arch }}-static-v6-fork

      - name: Build FreeRDP (static)
        if: steps.cache-freerdp.outputs.cache-hit != 'true'
        env:
          FREERDP_VER: ${{ steps.freerdp-ver.outputs.ver }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/freerdp-src"
          INSTALL="$HOME/freerdp-install"
          # Build from our fork's stable branch: the 3.10.3 release tag plus our
          # efficiency backports (rdpgfx send-buffer pre-allocation). Keeps the
          # API stable for the daemon while shipping the perf win. Upstream
          # contributions track master via FreeRDP/FreeRDP#12826 and #12827.
          git clone --depth 1 --branch "build/3.10.3-patched" \
            https://github.com/grioghar/FreeRDP.git "$SRC"
          cmake -S "$SRC" -B "$SRC/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS="-Os" \
            -DCMAKE_CXX_FLAGS="-Os" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DCMAKE_PREFIX_PATH="$OPENSSL_ROOT" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_SERVER=ON \
            -DWITH_PLATFORM_SERVER=OFF \
            -DWITH_CLIENT=OFF \
            -DWITH_CLIENT_COMMON=OFF \
            -DWITH_PROXY=OFF \
            -DWITH_SHADOW=OFF \
            -DWITH_SAMPLE=OFF \
            -DWITH_WINPR_TOOLS=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_SWSCALE=OFF \
            -DWITH_DSP_FFMPEG=OFF \
            -DWITH_CAIRO=OFF \
            -DWITH_OPUS=OFF \
            -DWITH_RDTK=OFF \
            -DWITH_WAYLAND=OFF \
            -DWITH_X11=OFF \
            -DWITH_CUPS=OFF \
            -DWITH_PCSC=OFF \
            -DWITH_JPEG=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_OSS=OFF \
            -DWITH_ALSA=OFF \
            -DWITH_PULSE=OFF \
            -DWITH_CHANNELS=ON \
            -DWITH_RDPSND=ON \
            -DWITH_CLIPRDR=ON \
            -DWITH_RDPGFX=ON \
            -DWITH_RDPEI=OFF \
            -DWITH_RDPDR=OFF \
            -DWITH_PRINTER=OFF \
            -DWITH_SMARTCARD=OFF \
            -DWITH_SERIAL=OFF \
            -DWITH_PARALLEL=OFF \
            -DWITH_URBDRC=OFF \
            -DWITH_VIDEO_ENCODER=OFF \
            -DWITH_NEON=OFF \
            -DBUILD_TESTING=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$SRC/build" --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$SRC/build"

      - name: Build macos-rdp-daemon
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DMACOS_RDP_STATIC=ON \
            -DFREERDP_STATIC_INSTALL="$HOME/freerdp-install" \
            -DCMAKE_PREFIX_PATH="$HOME/freerdp-install;$OPENSSL_ROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Verify binary
        run: |
          BIN=build/macos-rdp-daemon
          file "$BIN"
          otool -L "$BIN"
          EXTERNAL=$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/|@)' || true)
          if [[ -n "$EXTERNAL" ]]; then echo "Non-system deps: $EXTERNAL"; exit 1; fi
          strip -x "$BIN"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.arch }}
          path: build/macos-rdp-daemon
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create universal binary
        run: |
          chmod +x dist/daemon-arm64/macos-rdp-daemon dist/daemon-x86_64/macos-rdp-daemon
          lipo -create \
            dist/daemon-arm64/macos-rdp-daemon \
            dist/daemon-x86_64/macos-rdp-daemon \
            -output dist/macos-rdp-daemon
          lipo -info dist/macos-rdp-daemon
          ls -lh dist/macos-rdp-daemon

      - name: Compute checksum
        run: shasum -a 256 dist/macos-rdp-daemon > dist/SHA256SUMS

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          FREERDP_VER=$(tr -d '[:space:]' < .github/freerdp-version)
          sed -e "s/VERSION/${TAG}/g" -e "s/FREERDP_VER/${FREERDP_VER}/g" \
            .github/release-template.md > /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "macos-rdp-server $TAG" \
            --notes-file /tmp/release-notes.md \
            dist/macos-rdp-daemon \
            dist/SHA256SUMS
