name: Build and Release

# Single-runner universal build. A universal (arm64+x86_64) static OpenSSL is
# built from source once and cached, which lets FreeRDP and the daemon compile
# universal in one cmake pass — no build matrix, no per-arch runners, no lipo of
# the final binary. Everything builds from our forks.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3)'
        required: true

jobs:
  build-and-release:
    name: Build universal binary and release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Read dependency versions
        id: ver
        run: |
          echo "freerdp=$(tr -d '[:space:]' < .github/freerdp-version)" >> "$GITHUB_OUTPUT"
          echo "openssl=$(tr -d '[:space:]' < .github/openssl-version)" >> "$GITHUB_OUTPUT"

      # ── Universal static OpenSSL (built once from the fork, then cached) ──
      - name: Cache universal OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ~/ossl-universal
          key: openssl-${{ steps.ver.outputs.openssl }}-universal-static-v1

      - name: Build universal OpenSSL from source
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        env:
          OSSL_VER: ${{ steps.ver.outputs.openssl }}
        run: |
          set -euo pipefail
          JOBS=$(sysctl -n hw.logicalcpu)

          # Separate source tree per arch — eliminates any chance of arch-specific
          # generated assembly leaking between the two builds.
          build_arch() {
            local target="$1" prefix="$2" src="$3"
            git clone --depth 1 --branch "$OSSL_VER" https://github.com/grioghar/openssl.git "$src"
            ( cd "$src"
              ./Configure "$target" no-shared no-tests no-docs no-apps \
                  --libdir=lib --prefix="$prefix"
              make -j"$JOBS" >/dev/null
              make install_dev >/dev/null )
          }
          build_arch darwin64-arm64-cc  "$RUNNER_TEMP/ossl-arm64"  "$RUNNER_TEMP/ossl-src-arm64"
          build_arch darwin64-x86_64-cc "$RUNNER_TEMP/ossl-x86_64" "$RUNNER_TEMP/ossl-src-x86_64"

          # Merge thin slices into universal fat archives; headers are
          # identical for both LP64 darwin targets, so take arm64's.
          U="$HOME/ossl-universal"
          mkdir -p "$U/lib" "$U/include"
          cp -R "$RUNNER_TEMP/ossl-arm64/include/." "$U/include/"
          for lib in libssl libcrypto; do
            lipo -create \
              "$RUNNER_TEMP/ossl-arm64/lib/$lib.a" \
              "$RUNNER_TEMP/ossl-x86_64/lib/$lib.a" \
              -output "$U/lib/$lib.a"
          done
          echo "== universal OpenSSL archives =="
          lipo -info "$U/lib/libssl.a" "$U/lib/libcrypto.a"

      - name: Export OpenSSL root
        run: echo "OPENSSL_ROOT=$HOME/ossl-universal" >> "$GITHUB_ENV"

      # ── Universal static FreeRDP (fork branch, built once, cached) ──
      - name: Cache universal FreeRDP
        id: cache-freerdp
        uses: actions/cache@v4
        with:
          path: ~/freerdp-install
          key: freerdp-${{ steps.ver.outputs.freerdp }}-universal-${{ steps.ver.outputs.openssl }}-v1

      - name: Build universal FreeRDP from fork
        if: steps.cache-freerdp.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/freerdp-src"
          INSTALL="$HOME/freerdp-install"
          git clone --depth 1 --branch "build/3.10.3-patched" \
            https://github.com/grioghar/FreeRDP.git "$SRC"
          cmake -S "$SRC" -B "$SRC/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS="-Os" -DCMAKE_CXX_FLAGS="-Os" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DCMAKE_PREFIX_PATH="$OPENSSL_ROOT" \
            -DBUILD_SHARED_LIBS=OFF \
            -DWITH_SERVER=ON -DWITH_PLATFORM_SERVER=OFF \
            -DWITH_CLIENT=OFF -DWITH_CLIENT_COMMON=OFF -DWITH_PROXY=OFF \
            -DWITH_SHADOW=OFF -DWITH_SAMPLE=OFF -DWITH_WINPR_TOOLS=OFF \
            -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_DSP_FFMPEG=OFF \
            -DWITH_CAIRO=OFF -DWITH_OPUS=OFF -DWITH_RDTK=OFF \
            -DWITH_WAYLAND=OFF -DWITH_X11=OFF -DWITH_CUPS=OFF -DWITH_PCSC=OFF \
            -DWITH_JPEG=OFF -DWITH_WEBP=OFF -DWITH_OSS=OFF -DWITH_ALSA=OFF -DWITH_PULSE=OFF \
            -DWITH_CHANNELS=ON -DWITH_RDPSND=ON -DWITH_CLIPRDR=ON -DWITH_RDPGFX=ON \
            -DWITH_RDPEI=OFF -DWITH_RDPDR=OFF -DWITH_PRINTER=OFF -DWITH_SMARTCARD=OFF \
            -DWITH_SERIAL=OFF -DWITH_PARALLEL=OFF -DWITH_URBDRC=OFF \
            -DWITH_VIDEO_ENCODER=OFF -DWITH_NEON=OFF -DBUILD_TESTING=OFF \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build "$SRC/build" --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$SRC/build"

      # ── Daemon: one universal cmake pass ──
      - name: Build macos-rdp-daemon (universal)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="14.0" \
            -DMACOS_RDP_STATIC=ON \
            -DFREERDP_STATIC_INSTALL="$HOME/freerdp-install" \
            -DCMAKE_PREFIX_PATH="$HOME/freerdp-install;$OPENSSL_ROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Verify universal binary
        run: |
          BIN=build/macos-rdp-daemon
          echo "== architectures =="
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64" || { echo "missing arm64"; exit 1; }
          lipo -info "$BIN" | grep -q "x86_64" || { echo "missing x86_64"; exit 1; }
          echo "== external deps =="
          otool -L "$BIN"
          # Only tab-indented lines are dependencies. For a fat binary otool -L
          # also prints an unindented "(architecture X):" header per slice, plus
          # the binary-name header — those must NOT be treated as dependencies.
          EXTERNAL=$(otool -L "$BIN" | grep -E '^[[:space:]]' | awk '{print $1}' \
            | grep -Ev '^(/usr/lib/|/System/|@)' || true)
          if [[ -n "$EXTERNAL" ]]; then echo "Non-system deps: $EXTERNAL"; exit 1; fi
          strip -x "$BIN"
          ls -lh "$BIN"

      - name: Compute checksum
        run: shasum -a 256 build/macos-rdp-daemon > build/SHA256SUMS

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          FREERDP_VER=$(tr -d '[:space:]' < .github/freerdp-version)
          sed -e "s/VERSION/${TAG}/g" -e "s/FREERDP_VER/${FREERDP_VER}/g" \
            .github/release-template.md > /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "macos-rdp-server $TAG" \
            --notes-file /tmp/release-notes.md \
            build/macos-rdp-daemon \
            build/SHA256SUMS
